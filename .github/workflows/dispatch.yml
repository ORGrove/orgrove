# ORGrove dispatcher (#7): give work to roles that have been on coffee break for >= break_min.
# Stops when ORGROVE_ENABLED is not "true" (kill switch), except a dry run started by hand: it reads only, and it
# is how an install proves the App's reach before the agents are switched on (doctor, #159).
# What starts a tick: each finished role run (#27), the dispatcher's own wake-ups (wake.yml), the project repos'
# orgrove-notify workflow when a person acts (#159), the Office's buttons, and this schedule as the backstop.
name: dispatch
on:
  schedule:
    - cron: "3,33 * * * *"   # every 30 min, off the top of the hour: a backstop now (owner, 2026-10-29)
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: false
  # A person acting in this repo when it is also a project (ORGrove's own repo is); other projects use
  # templates/orgrove-notify.yml. Agents' events are skipped below, before a runner starts (#159).
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]
  pull_request:
    types: [closed]
permissions:
  contents: read
  actions: write   # GITHUB_TOKEN may start role-run (workflow_dispatch); nothing else
concurrency:
  group: orgrove-dispatch
  cancel-in-progress: false
jobs:
  tick:
    if: >-
      (vars.ORGROVE_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)) && (
        github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
        (github.event.sender.type != 'Bot' && (github.event_name != 'pull_request' || github.event.pull_request.merged)))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}   # never a PR's code, whatever started the tick
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install settings (config/org.toml, #159)
        id: org
        run: python -m orgrove.org >> "$GITHUB_OUTPUT"
      - name: App token (project issues/PRs/board, read ledger and runs)
        id: tok
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.ORGROVE_APP_ID }}
          private-key: ${{ secrets.ORGROVE_APP_PRIVATE_KEY }}
          owner: ${{ steps.org.outputs.owner }}
          repositories: ${{ steps.org.outputs.repositories }}
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write
          permission-actions: read
          permission-checks: read                   # CI on agent heads: no review of a red head (#151)
          permission-organization-projects: write   # keep board Status true
      # Separate token for the ledger: contents write on orgrove ONLY, so the token above stays read-only
      # on product code. The dispatcher appends one status event per tick (why each agent is idle, #98).
      - name: Ledger token (orgrove contents only)
        id: ltok
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.ORGROVE_APP_ID }}
          private-key: ${{ secrets.ORGROVE_APP_PRIVATE_KEY }}
          repositories: ${{ steps.org.outputs.repo_name }}
          permission-contents: write
      # Separate token for update-branch (#93): contents write on the project repos, used ONLY to merge main into
      # the bot's own PRs that are BEHIND. The token above stays read-only on product code. No workflows
      # permission, so GitHub refuses any merge that would change workflow files.
      - name: Update-branch token (project contents, bot PRs only)
        id: utok
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.ORGROVE_APP_ID }}
          private-key: ${{ secrets.ORGROVE_APP_PRIVATE_KEY }}
          owner: ${{ steps.org.outputs.owner }}
          repositories: ${{ steps.org.outputs.repositories }}
          permission-contents: write
          permission-pull-requests: write
      - name: Tick
        id: tick
        env:
          GH_TOKEN: ${{ steps.tok.outputs.token }}
          ORGROVE_DISPATCH_TOKEN: ${{ github.token }}
          LTOK: ${{ steps.ltok.outputs.token }}
          ORGROVE_UPDATE_TOKEN: ${{ steps.utok.outputs.token }}   # read by the #93 code once it merges
          ORGROVE_LEDGER_DIR: ${{ runner.temp }}/ledger
        run: |
          set -o pipefail
          bin/ledger-clone "${{ github.repository }}"
          python -m orgrove.dispatch ${{ inputs.dry_run && '--dry-run' || '' }} | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Book the next tick (a break ending, a follow-up, CI, or a wait on a person; see dispatch.wake_plan)
        if: steps.tick.outputs.wake_at != ''
        env:
          GH_TOKEN: ${{ github.token }}
          WAKE_AT: ${{ steps.tick.outputs.wake_at }}
        run: gh workflow run wake.yml -R "${{ github.repository }}" -f at="$WAKE_AT"
      - name: How much of the App's GitHub API allowance is left
        if: always()
        env:
          GH_TOKEN: ${{ steps.tok.outputs.token }}
        run: bin/api-allowance "ORGrove App, after this tick" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Retry in 15 minutes if this tick failed (at most 4 in a row)
        if: failure() && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A failed tick books no wake-up, and GitHub's schedule barely runs: on 2026-10-28 the App's API allowance
          # ran out and the agents stayed idle until a human noticed. Retry, but stop after 4 failed ticks in a row
          # (an hour, longer than the allowance window), so a lasting fault doesn't bill sleeping minutes all night.
          n=0
          for c in $(gh run list -R "$GITHUB_REPOSITORY" --workflow dispatch.yml -L 8 --json databaseId,status,conclusion \
                       --jq '.[] | select(.databaseId != ${{ github.run_id }} and .status == "completed") | .conclusion'); do
            [ "$c" = failure ] || break
            n=$((n + 1))
          done
          if [ "$n" -ge 4 ]; then echo "$n failed ticks in a row before this one: not retrying"; exit 0; fi
          gh workflow run wake.yml -R "$GITHUB_REPOSITORY" -f at="$(date -u -d '+15 minutes' +%Y-%m-%dT%H:%M:%SZ)"
