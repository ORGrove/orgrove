# Engineering department (#5). Roles, models, triggers and gates.
# Triggers name a stage (see config/stages.toml), a flag label, a deploy event or a cron.
department = "engineering"
stages = "config/stages.toml"
human_gates = ["merge"]
break_min = 0           # owner 2026-10-29: no break while work waits; an agent with nothing to do is on a break (was 15)
                        # The budget caps pace spending. An install that wants pacing may set minutes here (0-240).

[roles.pm]
outbox = ["comment", "questions", "sub_items", "stage_request"]   # what orgrove apply accepts from this role (#40)
skill = "pm"
model = "claude-opus-5-5"
method = "skills"
on = ["label:needs/plan"]
budget_share = 0.15
ceiling_usd = 1.5
contents = "read"
tools = ["Read", "Grep", "Glob", "Bash(gh issue:*)", "Bash(gh api:*)", "Bash(gh project item-edit:*)", "Bash(gh project field-list:*)", "Bash(gh project view:*)", "Bash(gh pr list:*)"]

[roles.dev]
outbox = ["comment", "questions", "stage_request"]   # what orgrove apply accepts from this role (#40)
skill = "dev"
model = "claude-sonnet-5-5"
method = "skills"
on = ["stage:planned", "label:needs/fix"]
budget_share = 0.45
ceiling_usd = 2.0
contents = "write"
runs_commands = true   # runs the project's commands: gets the project's `tools` too (#159)
tools = ["Read", "Grep", "Glob", "Edit", "Write", "Bash(git:*)", "Bash(gh issue:*)", "Bash(gh api:*)", "Bash(gh run view:*)", "Bash(cd:*)", "Bash(ls:*)"]
wip = 2

[roles.qa]
outbox = ["verdict", "comment", "questions", "sub_items"]   # what orgrove apply accepts from this role (#40)
skill = "qa"
model = "claude-sonnet-5-5"
method = "skills"
on = ["stage:agent-review"]
budget_share = 0.15
ceiling_usd = 1.0
contents = "read"
runs_commands = true   # runs the project's commands: gets the project's `tools` too (#159)
tools = ["Read", "Grep", "Glob", "Bash(git diff:*)", "Bash(git log:*)", "Bash(git show:*)", "Bash(gh issue:*)", "Bash(gh api:*)", "Bash(cd:*)", "Bash(ls:*)"]

[roles.security]
outbox = ["verdict", "comment", "questions", "sub_items"]   # what orgrove apply accepts from this role (#40)
skill = "security"
model = "claude-opus-5-5"
method = "skills"
on = ["stage:agent-review"]
budget_share = 0.15
ceiling_usd = 1.5
contents = "read"
tools = ["Read", "Grep", "Glob", "Bash(git diff:*)", "Bash(git log:*)", "Bash(git show:*)", "Bash(gh issue:*)", "Bash(gh api:*)", "Bash(ls:*)"]

[roles.devops]
outbox = ["comment", "questions", "stage_request"]   # what orgrove apply accepts from this role (#40)
skill = "devops"
model = "claude-sonnet-5-5"
method = "skills"
on = ["label:area/infra", "deploy:failed"]
budget_share = 0.05
ceiling_usd = 1.5
contents = "write"
runs_commands = true   # runs the project's commands: gets the project's `tools` too (#159)
tools = ["Read", "Grep", "Glob", "Edit", "Write", "Bash(git:*)", "Bash(gh issue:*)", "Bash(gh api:*)", "Bash(gh run:*)", "Bash(cd:*)", "Bash(ls:*)"]

[roles.sanity]
outbox = ["verdict", "comment", "questions", "sub_items"]   # what orgrove apply accepts from this role (#40)
skill = "sanity"
model = "claude-haiku-5-5"
method = "skills"
on = ["stage:deployed-dev"]
budget_share = 0.05
ceiling_usd = 0.5
contents = "read"
tools = ["Read", "Bash(curl:*)", "Bash(gh issue:*)", "Bash(gh api:*)", "Bash(gh run:*)"]
