<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ORGrove Pro</title>
<link rel="icon" href="/brand/orgrove-symbol.png">
<!-- Shown at the address of a part this copy doesn't have (orgrove/editions.py), instead of a bare 404. -->
<style>
:root { --bg: #f6f7f4; --panel: #fff; --ink: #1d2320; --muted: #66706b; --line: #e3e6e1; --accent: #3a5ccc; }
@media (prefers-color-scheme: dark) { :root { --bg: #111513; --panel: #181e1b; --ink: #e6ebe8; --muted: #93a09a; --line: #26302b; --accent: #8aa4ff; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 16px 28px; align-items: center; padding: 16px 24px; border-bottom: 1px solid var(--line); background: var(--panel); }
.logos { display: flex; align-items: center; gap: 10px; }
.logos img { display: block; width: auto; }
.logos .product { height: 30px; }
.logos .client { height: 18px; }
.logos .client-name { font-size: 15px; letter-spacing: -.01em; }
.logos .for { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding-left: 10px; border-left: 1px solid var(--line); }
main { max-width: 560px; margin: 0 auto; padding: 56px 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 28px; }
.tag { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
h1 { font-size: 22px; margin: 6px 0 10px; }
p { margin: 0 0 18px; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; }
.actions a { padding: 8px 16px; border-radius: 6px; font-weight: 600; text-decoration: none; border: 1px solid var(--accent); color: var(--accent); }
.actions a.primary { background: var(--accent); color: #fff; }
.byline { text-align: center; color: var(--muted); font-size: 12px; padding: 28px 16px; }
</style>
</head>
<body>
<header>
  <div class="logos">
    <picture><source media="(prefers-color-scheme: dark)" srcset="/brand/orgrove-dark.png"><img class="product" src="/brand/orgrove-light.png" alt="ORGrove"></picture>
    <!--ORGROVE_CLIENT-->
  </div>
</header>
<main>
  <section class="card">
    <div class="tag">Part of ORGrove Pro</div>
    <h1>__PART_NAME__</h1>
    <p>__PART_ABOUT__ Your copy is ORGrove Community, which has the agents and the Office, but not this.</p>
    <div class="actions">
      <a class="primary" href="__PRO_URL__" target="_blank" rel="noopener">Join the ORGrove Pro waitlist</a>
      <a href="/">Back to the Office</a>
    </div>
  </section>
</main>
<footer class="byline">ORGrove · powered by OpsVision AI Systems Pvt Ltd</footer>
</body>
</html>
